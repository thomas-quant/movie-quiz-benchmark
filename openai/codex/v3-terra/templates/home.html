{% extends "base.html" %}
{% block title %}Reel Types — Movie Quiz{% endblock %}
{% block content %}
  <section class="intro-card">
    <p class="eyebrow">MOVIE GENRE QUIZ</p>
    <h1>Can you name the movie type?</h1>

    </form>
  </section>
{% endblock %}
